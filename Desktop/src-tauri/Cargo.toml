[package]
name = "homepod-sender"
version = "2.0.0"
description = "把电脑声音实时推送到 HomePod（AirPlay 2）"
authors = ["HomePodSender"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "HomePodSender"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
